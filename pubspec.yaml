name: app
description: "Aplicación móvil offline-first para productores agrícolas de Magdalena."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.4
  sqflite: ^2.4.2
  path: ^1.9.1
  dio: ^5.7.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
